# ********************************
# VRX backpack targets
# ********************************

[env:HDZero_RX51_ESP_RX_Backpack_via_UART]
extends = env_common_esp8285, hdzero_vrx_backpack_common
monitor_speed = 115200
build_flags =
	${env_common_esp8285.build_flags}
	${hdzero_vrx_backpack_common.build_flags}
	-D PIN_BUTTON=0
	-D PIN_LED=16

[env:HDZero_RX51_ESP_RX_Backpack_via_WIFI]
extends = env:HDZero_RX51_ESP_RX_Backpack_via_UART

[env:HDZero_RX51_ESP01F_Backpack_via_UART]
extends = env:HDZero_RX51_ESP_RX_Backpack_via_UART

[env:HDZero_RX51_ESP01F_Backpack_via_WIFI]
extends = env:HDZero_RX51_ESP_RX_Backpack_via_UART

[env:HDZero_RX51_HappyModel_EP82_VRX_Backpack_via_UART]
extends = env:HDZero_RX51_ESP_RX_Backpack_via_UART

[env:HDZero_RX51_HappyModel_EP82_VRX_Backpack_via_WIFI]
extends = env:HDZero_RX51_ESP_RX_Backpack_via_UART

[env:HDZero_RX51_ESP32_Backpack_via_UART]
extends = env_common_esp32, hdzero_vrx_backpack_common
monitor_speed = 115200
build_flags =
	${env_common_esp32.build_flags}
	${hdzero_vrx_backpack_common.build_flags}
	-D PIN_LED=4

[env:HDZero_RX51_ESP32_Backpack_via_WIFI]
extends = env:HDZero_RX51_ESP32_Backpack_via_UART



[env:HDZero_Goggle_ESP32_Backpack_via_UART]
extends = env_common_esp32, hdzero_vrx_backpack_common
monitor_speed = 115200
build_flags =
	${env_common_esp32.build_flags}
	${hdzero_vrx_backpack_common.build_flags}
	-D PIN_LED=4
	-D NO_AUTOBIND=1
	-D SUPPORT_HEADTRACKING

[env:HDZero_Goggle_ESP32_Backpack_via_WIFI]
extends = env:HDZero_Goggle_ESP32_Backpack_via_UART

# ESP32-S3 SuperMini as an HDZero-protocol VRx backpack for C5VRX
# (https://github.com/Twotoz/C5VRX). Same firmware as the HDZero RX5.1 ESP32
# target on the stock ESP32-S3 base: MSP over UART0 at 115200, TX = GPIO43.
# SuperMini: 4 MB flash, BOOT button on GPIO0; its LED (GPIO48 on most clones
# is a WS2812) is left unused.
[env:HDZero_ESP32S3_SuperMini_C5VRX_Backpack_via_UART]
extends = env_common_esp32s3, hdzero_vrx_backpack_common
board_upload.flash_size = 4MB
board_build.flash_mode = dio
build_flags =
	${env_common_esp32s3.build_flags}
	${hdzero_vrx_backpack_common.build_flags}
	-D PIN_BUTTON=0
	-D C5VRX_USB_MIRROR=1
	-D C5VRX_ONE_WIRE=1

[env:HDZero_ESP32S3_SuperMini_C5VRX_Backpack_via_WIFI]
extends = env:HDZero_ESP32S3_SuperMini_C5VRX_Backpack_via_UART

[env:HDZero_ESP32S3_SuperMini_C5VRX_Backpack_DEBUG]
extends = env:HDZero_ESP32S3_SuperMini_C5VRX_Backpack_via_UART
build_flags =
	${env:HDZero_ESP32S3_SuperMini_C5VRX_Backpack_via_UART.build_flags}
	-D DEBUG_LOG
	-D LOGGING_UART=USBSerial
