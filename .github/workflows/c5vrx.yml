name: C5VRX Backpack
on:
  push:
    branches: [c5vrx]
    tags: ['backpack-v*']
  pull_request:
    branches: [c5vrx]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [c3, s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19 esptool==4.5.1
      - run: python -m unittest discover -s test -p test_release_guard.py
      - name: Build and package generic firmware
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.board }}' == c3 ]]; then chip=C3; else chip=S3; fi
          pio run -e "HDZero_ESP32${chip}_SuperMini_C5VRX_Backpack_DEBUG"
          python tools/package_c5vrx.py --board '${{ matrix.board }}'
      - uses: actions/upload-artifact@v4
        with:
          name: c5vrx-backpack-${{ matrix.board }}
          path: dist/c5vrx-backpack-${{ matrix.board }}.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/backpack-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: c5vrx-backpack-*
          merge-multiple: true
          path: dist
      - name: Attach verified packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum c5vrx-backpack-*.zip > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "C5VRX Backpack $GITHUB_REF_NAME" \
              --notes 'Unofficial C3/S3 SuperMini HDZero one-wire backpack firmware for C5VRX. Images contain no compiled binding phrase, UID or home Wi-Fi credentials. Follow docs/SETUP.md to flash and bind. Channel-control bench evidence uses locally bound C3/V5 and earlier S3/V4 builds; runtime binding of these generic images and the new generic S3 build still need board checks. Source, provenance and GPL notices are in the repository.'
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" c5vrx-backpack-*.zip SHA256SUMS
